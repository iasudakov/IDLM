logger:
  _target_: underdeep_logger.UnderdeepLogger
  experiment: generative-models/tinygsm
  name: duo
  save_dir: ${checkpointing.save_dir}
  resume: false
  force_new_run: true

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
  # Restore save_dir from Nirvana before checking resume_ckpt_path; push the
  # whole directory after each evaluated or custom train-batch checkpoint.
  # No-op without the Nirvana runtime. Failed transfers are logged, not fatal.
  snapshot: true
  use_periodic_train_batch_checkpoint: false
  # Save after each training validation at or above this global optimizer step.
  # Independent of periodic train-batch checkpoints and best-model selection.
  save_evaluated_checkpoints: false
  save_evaluated_from_step: 0
