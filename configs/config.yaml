defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: openwebtext
  - /model: small
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant_warmup
  - /prior: none
  - /algo: duo_base
  - /logger: underdeep

mode: train  # train / ppl_eval / sample_eval / noise_diversity_eval
debug: False
seed: 1

adversarial_distill:
  is_distill: False
  accum_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  fake_frequency: 1
  generator_num_noised_samples: 1
  # Gradient clipping inside the manual-optimization (min-max) loop. Lightning
  # does not apply `trainer.gradient_clip_val` when automatic_optimization is
  # off, so this is the only clipping the adversarial steps get. Disabled by
  # default; set to True to clip to `gradient_clipping_val`. The pre-clip
  # gradient norm is logged (grad_norm_student / grad_norm_fake) either way.
  use_gradient_clipping: False
  # Max gradient norm used when `use_gradient_clipping` is True. null or <= 0
  # also disables clipping.
  gradient_clipping_val: 1.0
  # Critic family: 'ar' = autoregressive owt-ar teacher/fake; 'diffusion' =
  # copies of the masked-diffusion student as teacher/fake (original IDLM).
  critic_type: ar
  # Whether to use the trainable fake critic. False disables the fake model
  # entirely (not created, no fake steps) and trains the generator with only the
  # teacher term, i.e. generator loss = teacher_loss (no min-max).
  use_fake: True
  # Autoregressive teacher (and fake-model initialisation) for MDLM_with_AR.
  # A HF hub id or a local dir with the owt-ar config.json / pytorch_model.bin.
  ar_model_path: kuleshov-group/owt-ar
  # Learning rate for the fake critic. null => fall back to optim.lr (original
  # IDLM: fake and student share optim.lr). Set e.g. 1e-4 to give the critic a
  # larger, separate LR (two-time-scale).
  fake_lr: null
  # Target used to fit the fake critic to the student (D-MMD Sec. 3.2 / the
  # "Optional use soft target" line of Algorithm 1). False => the one-hot hard
  # sample x ~ Cat(x_hat_eta(z_t)) the critic latent was drawn from. True => the
  # student's full soft distribution, i.e. the Rao-Blackwellisation of that
  # target: same expectation, no per-position sampling noise, and for the AR
  # critic exactly the quantity the generator step differentiates.
  # null (default) => each critic keeps the default it was written with, so
  # existing runs are unchanged: hard for critic_type=ar, soft for
  # critic_type=diffusion. Set True/False explicitly to A/B it; the latent /
  # context the critic sees is the hard sample either way, so at a fixed seed the
  # two differ only in the target. Only the fake/auxiliary step is affected --
  # the generator always uses the soft path.
  # NOTE 1 (paper, same section): valid for *masked* diffusion only. Uniform
  # diffusion (algo=duo*) must train its auxiliary model on hard samples.
  # NOTE 2: with the diffusion critic the *logged* `fake_loss` is not comparable
  # across the two settings. `_process_model_output` pins already-revealed
  # positions to a one-hot (`neg_infinity` elsewhere), which the hard target
  # zeroes out but the soft target multiplies its off-token mass against, adding
  # a term ~1e5x the real signal. It is a constant assignment, so it contributes
  # no gradient -- training is unaffected, but compare `student_loss` /
  # `val/gen_ppl` rather than `fake_loss` between the modes.
  fake_soft_target: null
  # Weight of the auxiliary->teacher regularizer in the fake-model loss
  # (D-MMD Eq. 12, second term): CE(teacher || fake) on the student's samples.
  # Anchors the fake critic to the teacher, stabilizing the min-max without
  # changing the fixed point. 0 => original IDLM fake loss (no anchor term).
  fake_teacher_weight: 0.0
  # Log `student_entropy` next to student_loss / fake_loss on every generator
  # step: the mean entropy (nats) of the student's own prediction
  # p_eta(x0 | z_t) at the positions it actually predicted, read off the same
  # tensor the generator loss differentiates (no extra forward pass). Purely a
  # diagnostic -- it is detached and never added to the objective. It
  # separates the two ways student_loss can fall: matching the teacher, or
  # sharpening onto a few modes the critic likes. The latter shows up here as
  # entropy heading toward 0. The training-time counterpart of
  # `eval.compute_pred_entropy` (which reads the sampling trajectory instead).
  log_student_entropy: True
  # Weight of the entropy bonus in the generator objective:
  #   g_loss = teacher_loss - fake_loss - entropy_weight * H
  # where H is the same student entropy `log_student_entropy` reports,
  # reduced over positions exactly like the two critic terms, so the weight
  # trades off against them directly and does not need rescaling with
  # `model.length`. Positive => push entropy UP, which is what fights the
  # collapse this objective can drift into (the student can lower
  # teacher_loss - fake_loss either by matching the teacher or by narrowing
  # onto the modes both critics like). Negative sharpens instead.
  # 0 (default) reproduces the previous objective exactly and builds nothing
  # differentiable -- the diagnostic stays on either way.
  # Enabling it costs one extra p-sized tensor (~1.6 GB at batch_size=8,
  # model.length=1024, float32) retained until backward.
  # CALIBRATION: with valid_tokens=None (OWT) `_reduce_positions` *sums* over
  # positions, so the reduced H is ~(masked positions) x (nats/position) --
  # order 1e3 at model.length=1024 -- while student_loss is a *difference* of
  # two large critic terms and is numerically far smaller. Expect a useful
  # weight around 1e-3..1e-2, not O(1). Don't guess: `entropy_bonus` is logged
  # next to student_loss whenever this is non-zero and is exactly what gets
  # subtracted, so set the weight so the bonus is a few percent of
  # |student_loss|, then watch student_entropy move.
  # The bonus is unbounded above, so an over-large weight has a trivial
  # optimum at the uniform distribution and will walk the model to noise.
  entropy_weight: 0.0
  # Diffusion time weighting `w` applied to every distillation cross-entropy
  # (teacher term, fake term, aux->teacher anchor) for both algo=mdlm and
  # algo=mdlm_dmmd. Only `critic_type=diffusion` is affected; the AR critic
  # scores the clean sequence and carries no time weight.
  # 'elbo' (default) => w = -alpha'/(1-alpha), the MDLM ELBO weight, which is
  # both IDLM's lambda_t (its Eq. 1/7) and a valid choice of D-MMD's w(s)
  # (Algorithm 1 leaves w free and never pins it down). Under the log-linear
  # schedule this is 1/t at the critic time: 1 at t=1 up to ~1e3 at the
  # training.sampling_eps floor, mean ~7.
  # 'none' (or false) => w = 1, i.e. plain unweighted cross-entropy. The fixed
  # point is unchanged (w scales the teacher and fake terms alike, and
  # `teacher - fake` vanishes when the fake critic matches the teacher), so this
  # is a pure optimization knob: it stops near-clean critic times (small s, where
  # only a few positions are masked and 1/s explodes) from dominating the update,
  # at the cost of ~7x smaller average gradients -- expect to raise optim.lr /
  # fake_lr by roughly that factor for a like-for-like comparison. `null` keeps
  # the default, as elsewhere in this config.
  loss_weighting: elbo
  # Generator input-noise conditioning (D-MMD Sec. 6.5). Dimensionality of the
  # per-token Gaussian noise projected into the student's embedding residual so
  # the masked generator can stay diverse instead of collapsing. 0 => disabled
  # (original IDLM).
  noise_dim: 0
  # Granularity of the above noise conditioning. False (default) draws an
  # independent Gaussian per token position; True broadcasts one per-sample
  # vector across all token embeddings (same noise for every position).
  noise_shared: False
  # INITIAL size of the injected noise vector, as a multiple of the student
  # embedding's own per-entry std -- i.e. the initial `noise/snr`. The projection
  # output is always rescaled by `embed_std / sqrt(noise_dim)` (measured from the
  # loaded checkpoint), so this is just the init RMS of the projection weight and
  # the units are the same across noise_dim / backbones.
  # 0.0 (default) => zero-init. The wrapped student starts as an exact copy of
  # the checkpoint's function and grows its noise usage only if the objective
  # pays for it -- nothing is destroyed at step 0, which matters when distilling
  # a pretrained model. It still trains (zero-init residual branch).
  # 1.0 => the injection starts as large as the token identity itself. Values
  # >> 1 (e.g. 10) mean the residual is mostly noise and the student cannot read
  # its own masked context until it has attenuated the projection.
  # With `noise_warmup_steps > 0` (or `noise_hold_rms`) this is instead the
  # snr the schedule ramps to / holds, and the zero start comes from the ramp.
  # It must then be > 0: the objective cannot find a useful noise level on its
  # own (see below), so leaving this at 0 schedules nothing.
  # Otherwise this is ONLY an init and `noise_lr` is the knob that controls the
  # magnitude thereafter. Watch `noise/snr` and `noise/proj_norm`.
  noise_scale: 0.0
  # Steps over which the injected noise is ramped in, from a gain of 0 (the
  # forward pass is then bit-identical to the loaded checkpoint) up to
  # `noise_scale` -- linearly, in trainer global steps (student + fake updates,
  # the x-axis the `noise/*` diagnostics are logged against). 0 => no ramp.
  #
  # This exists because a zero-init projection does NOT grow on its own and no
  # `noise_lr` makes it: `W = 0` is an exact saddle, since the output does not
  # depend on the noise there and so `E[dL/dW] = c E[g] E[z]^T = 0`. Only
  # gradient noise moves it -- measured, snr reached 0.04 after 80k steps at
  # noise_lr=1e-3, below even the ~`noise_lr * sqrt(T)` of an unbiased random
  # walk. Meanwhile a `noise_scale=0.5` run decays to snr ~0.35 over the same
  # 80k steps while scoring the *better* generative perplexity: the objective
  # mildly prefers less noise than is good for sample quality. So the ramp is
  # the way to have both the safe zero start (nothing destroyed at step 0, the
  # reason to zero-init when distilling a pretrained checkpoint) and a noise
  # level the objective would never have reached by itself.
  noise_warmup_steps: 0
  # Pin `rms(W)` to `noise_scale` for the whole run by normalising the projection
  # in the forward pass, leaving only its *direction* learnable. Stops the slow
  # erosion described above, so the snr you set is the snr you keep. Requires
  # noise_scale > 0. False => the magnitude stays learnable (the historical
  # behaviour) and `noise/snr` drifts wherever the objective takes it.
  noise_hold_rms: False
  # Separate learning rate for the learned noise-projection matrix. null => it
  # trains at optim.lr like the rest of the student. Only used when noise_dim>0.
  # Under the rescaled parameterization above, Adam moves `noise/snr` by roughly
  # this much per step (sign-consistent upper bound), so ~1e-3 reaches snr ~1 in
  # a few thousand steps and 1e-4 takes ~1e4+. NOTE: not comparable to runs from
  # before the rescaling, where the same value moved snr ~sqrt(noise_dim)/
  # embed_std (~37x at noise_dim=128 on mdlm-owt) faster.
  noise_lr: null
  # Number of sampling steps k for the D-MMD posterior scheme (algo=mdlm_dmmd,
  # MDLM_with_DMMD). The generation time t is drawn one step above the uniform
  # critic time s via delta_t ~ U(0, 1/k), t = min(1, s + delta_t), so the critic
  # latent z_s ~ q(z_s | z_t, x). Smaller k => a bigger gap between s and t (more
  # positions revealed per step) and more mass on the t = 1 atom, where the
  # generator sees the near-fully-masked input it starts sampling from.
  # Ignored by the original IDLM re-noising path (algo=mdlm).
  dmmd_num_steps: 32
  # Mask-sampling scheme for algo=mdlm_dmmd (MDLM_DMMD). 'posterior' ('s'):
  # D-MMD Algorithm 1, critic latent z_s ~ q(z_s | z_t, x) at t = min(1, s+delta).
  # 'renoise' ('t'): original IDLM, re-noise student_probs to an independent
  # time t. Lets the two schemes be A/B-tested with everything else fixed.
  dmmd_mask_sampling: posterior
  # D-MMD Sec. 3.3 top-p (nucleus) teacher distillation (algo=mdlm_dmmd). The
  # teacher target is restricted to the top-p nucleus so the student mode-seeks.
  # >= 1 disables it (teacher target unchanged); the paper's best masked-text
  # value is ~0.85. Applies in both dmmd_mask_sampling modes.
  top_p: 1.0
  # Constant Delta by which out-of-nucleus teacher logits are lowered instead of
  # hard-masking (D-MMD Sec. 3.3, paper uses Delta=2). Avoids gradient spikes.
  top_p_delta: 2.0
  # Train/decode alignment: restrict the distillation losses to the positions a
  # confidence-threshold sampler would actually commit at this noise level --
  # among the positions the student predicted (masked in its own input), those
  # whose top probability clears the threshold, and always at least `min_k` of
  # them. Everything below the bar is discarded at sampling time and re-predicted
  # later with more context, so supervising it trains the student on marginals no
  # sample is ever drawn from -- and those are the hardest positions, so they
  # dominate the gradient while contributing nothing to what is emitted.
  # 'none' (default) => original behaviour, bit-for-bit.
  # 'generator' => mask the student's objective only; the fake critic keeps
  #   modelling every position, so it stays an accurate critic off-support.
  # 'both' => mask the fake critic's objective too, so critic and generator are
  #   fit on the same token set.
  # NOTE this changes the loss *scale*: the reduction becomes a mean over the
  # committed tokens (see `_reduce_positions`), where an OWT run with no
  # `valid_tokens` previously summed over all `model.length` positions. Revisit
  # optim.lr / fake_lr when switching it on.
  confidence_loss_mask: none
  # Threshold and k for the above. null => inherit sampling.confidence_threshold
  # / sampling.min_reveal, so training filters on exactly the rule decoding uses.
  # Set explicitly only to decouple the two.
  confidence_loss_threshold: null
  confidence_loss_min_k: null

loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ancestral  # ancestral_cache (only for MDLM), ancestral, analytic, confidence
  steps: 1000
  noise_removal: ancestral  # 'ancestral', 'greedy', 'none'
  use_float64: True
  p_nucleus: 1.0
  # --- predictor: confidence (block-diffusion style decoding) ---
  # Which positions to commit: every masked position whose predicted
  # probability is >= `confidence_threshold`, at least `min_reveal` of
  # them per step. `steps` is only a budget cap for this predictor, and
  # a threshold > 1.0 gives plain top-`min_reveal`-per-step decoding.
  confidence_threshold: 0.9
  min_reveal: 1
  block_size: 0  # 0 => decode the whole sequence at once (no semi-AR blocks)
  # Which token to write there: softmax temperature on the proposed
  # token only (the threshold above always sees the untempered
  # probability). 0 => greedy argmax, as in every LLaDA / dInfer
  # threshold decoder; 1.0 matches the ancestral sampler's categorical
  # draw. NOTE at 0 an unconditional batch is deterministic, so all rows
  # come out identical unless the student injects input noise
  # (adversarial_distill.noise_dim > 0) -- use 1.0 to measure entropy /
  # gen-ppl over a diverse batch.
  temperature: 0.0
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False
  loss_precision: 'bf16'  # bf16, float32, float64
  finetune_path: ''

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  # GPT-2 Gradient Moment (GM), D-MMD paper Eq. 13/14 -- the paper's headline
  # metric (Table 5). Logged as val/gm. Requires `trainer.inference_mode=false`
  # (GM needs gradients; Lightning validation is inference-mode by default).
  compute_gm: False
  gm_eval_model_name_or_path: gpt2   # paper uses GPT-2 base for GM
  gm_num_batches: 4                  # M paired (gen,data) batches; needs >= 2
  compute_perplexity_on_sanity: False
  # Mean entropy (nats) of the denoiser's *own* predictive distribution
  # p_theta(x0 | x_t), averaged over every (denoiser call, still-masked
  # position) pair of the sampling trajectory -- so the early, mostly-masked
  # steps carry the most weight. Logged as val/pred_entropy.
  # Complements val/sample_entropy (unigram entropy of the finished tokens):
  # this one reads per-position confidence, so it is what drops when
  # distillation or nucleus truncation sharpens the conditionals. Bounded by
  # log(vocab_size) ~= 10.82. Free of extra forward passes -- it reduces the
  # p_x0 the sampler already computed -- but set False to skip the reduction.
  compute_pred_entropy: True
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  generated_samples_path: ${cwd:}/samples.json
  # --- Quality/diversity Pareto curve ---
  # val/sample_entropy and val/gen_ppl plotted against each other rather than
  # against the step: one point per validation, so the run traces the
  # trade-off it is buying as it trains. Refreshed on exactly the schedule
  # those two scalars are (every validation, same global step) and costs no
  # extra sampling -- it reuses the numbers already computed. The point is
  # appended to `pareto_path` and the re-rendered curve is logged as an image
  # under `pareto_image_key` by loggers that support images (underdeep does;
  # TensorBoard silently skips it). See `pareto_curve.py`, which also plots
  # several runs' histories together offline:
  #   python -m pareto_curve a/pareto_curve.jsonl b/pareto_curve.jsonl -o p.png
  pareto_curve: True
  # Under `checkpointing.save_dir`, not `${cwd:}`, so the history keeps
  # accumulating across resumes of the same run -- same convention as the
  # tracker's own `underdeep_metadata.pt`.
  pareto_path: ${checkpointing.save_dir}/pareto_curve.jsonl
  pareto_image_key: val/pareto
  # --- Input-noise diversity probe (`mode=noise_diversity_eval`, or set this
  # flag to also run it at every validation) ---
  # Generates the same batch several times with the decoding randomness
  # replayed and only the injected input noise (adversarial_distill.noise_dim)
  # varied, and reports how much the samples move -- i.e. whether the noise
  # channel the generator was given is actually buying diversity or is being
  # ignored. Logged as val/noise_div/*; see
  # `trainer_base.TrainerBase.noise_diversity_report` for what each number is.
  # Costs `2 * num_noises + 1` extra sampling batches per validation.
  noise_diversity: False
  noise_diversity_num_noises: 4      # noise draws to compare (>= 2)
  noise_diversity_num_samples: null  # null => loader.eval_batch_size
  noise_diversity_seed: 0
  # Also run the mirror-image control (one noise draw, several decoding seeds)
  # so the noise contribution can be read against the sampler's own. Halve the
  # cost by turning it off once you know what the sampler contributes.
  noise_diversity_decode_control: True
  noise_diversity_path: ${cwd:}/noise_diversity.json

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 1_000_000
  log_every_n_steps: 100
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 5000

# wandb:
#   project: flow-ode
#   notes: Flow ODEs for UDLM
#   group: null
#   job_type: null
#   name: null
#   id: ${.name}_${seed}
#   tags:
#     - ${noise.type}
#     - ${data.train}
#     - ${data.valid}
#     - ${algo.name}

# `logger` is composed from the /logger config group (see defaults above).
# Default: underdeep experiment tracker. Use `logger=tensorboard` for TensorBoard.

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
  use_periodic_train_batch_checkpoint: false
