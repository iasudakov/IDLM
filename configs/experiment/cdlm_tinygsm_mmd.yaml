# @package _global_
defaults:
  - cdlm_tinygsm
  - _self_

# Published TinyGSM MMD student from the project's README. The native release
# contains EMA inference weights used for both the trajectory teacher and student.
training:
  finetune_path: hf://yresearch/MDLM-MMD-TinyGSM/model.ckpt
  teacher_use_ema: True
  teacher_allow_hub: True
  student_init_path: hf://yresearch/MDLM-MMD-TinyGSM/model.ckpt
  student_init_use_ema: True
logger:
  name: mmd to cdlm tinygsm lr1e-5 16 epochs
