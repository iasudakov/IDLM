defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: openwebtext
  - /model: small
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant_warmup
  - /prior: none
  - /algo: duo_base

mode: train  # train / ppl_eval / sample_eval / gsm8k_eval
debug: False

gsm8k:
  input_file: null  # if set, skip sampling and evaluate directly from this JSON file
  output_dir: ${cwd:}/gsm8k_eval
  timeout: 5.0
  bootstrap_size: 1  # 1 = single estimate (std=0); >1 = N bootstrap resamples, report mean +/- std

seed: 1

# Optional local model/tokenizer bundle. With this set, model assets are loaded
# from local files only; native checkpoint paths may be relative to the bundle.
model_weights_dir: null

adversarial_distill:
  is_distill: False
  # --- Paired AR feature reward (ported from yrOPDLM's rl-mmd branch) ---
  # A frozen autoregressive model used as a fixed *feature map* rather than a
  # likelihood critic: run it over the clean answer and over the student's
  # sample, read one middle block's hidden states, and reward the student for
  # closing the feature gap. Historical token/rows modes use pseudo-Huber;
  # `mmd_kernel_source=draws` plus `mmd_kernel_level=sentence` uses the explicit
  # linear, RBF or pseudo-Huber distance-induced MMD estimator documented below.
  # The optional linear_l2 kernel scores MSE between empirical feature means
  # in every token/sentence and rows/draws mode.
  # Optimized by REINFORCE over `mmd_group_size` samples drawn at the same
  # state. Groups of at least two use a leave-one-out baseline; a group of one
  # uses the separately configured fallback. See `mmd_reward.py`.
  #
  # 0 disables it entirely -- the AR is never even loaded and the objective is
  # exactly the published `teacher_loss - fake_loss`. The reward is large in
  # magnitude (hidden states far exceed the pseudo-Huber's c=1e-3, so it is
  # effectively -mean|delta|), so a useful weight is well below 1.
  # Weight on the published DMD objective (`teacher_loss - fake_loss`). 1.0 is
  # upstream. Setting it to 0 trains the generator from the feature reward
  # alone: the teacher/fake forwards are skipped, and so are the fake steps,
  # since nothing would read the critic they train.
  dmd_weight: 1.0
  mmd_reward_weight: 0.0
  # Where the features come from.
  #  * 'diffusion': the frozen teacher -- a copy of the student taken before
  #    training, i.e. the finetune_path weights. It is the model being
  #    distilled, so its features encode what a plausible TinyGSM solution
  #    looks like rather than plausible text in general; it shares the
  #    student's vocabulary exactly; and it is already in memory. Both rows are
  #    masked to `mmd_noise_level` first, with the *same* mask, because a
  #    denoiser is a function of a noised latent and never saw a clean sequence.
  #  * 'ar': an external causal LM, the direct analogue of yrOPDLM's frozen
  #    Qwen3. Must share the student's tokenizer.
  # What a sampled answer is scored ON. The group sampling, the leave-one-out
  # baseline and REINFORCE machinery are shared; the reward function changes.
  #   feature -- pooled-feature distance to x0 under a frozen model. A
  #              similarity to one particular reference answer, which is why the
  #              probe finds it behaving close to a soft edit distance.
  #   feature_mse -- negative MSE of real/generated features at matching masked
  #              token positions, averaged over hidden coordinates and tokens.
  #              Uses the same feature source/layers/noise; requires
  #              mmd_score_positions: written. Ignores kernel/RBF/pooling
  #              settings. With source=rows, scores each row independently
  #              (ignores kernel_batch_size). With source=draws, averages K
  #              per-draw MSE rewards; the surrogate does not divide by K again.
  #   idlm    -- the ELBO log-density ratio log p_teacher(x) - log p_fake(x),
  #              the same quantity DMD differentiates, reached by a score
  #              estimator instead. Judges the sample on its own merits rather
  #              than against a reference, and needs no feature map, so
  #              mmd_feature_source / mmd_feature_layer / mmd_ar_model are all
  #              ignored. It needs a TRAINED fake model -- an untrained one is
  #              still a copy of the teacher and the ratio collapses to ~0 for
  #              every sample -- so the fake phase keeps running even at
  #              dmd_weight=0, which for the feature reward would switch it off.
  #              `dmd_weight=0` with this reward therefore means: train the fake
  #              as usual, but give the generator only the REINFORCE term.
  mmd_reward_type: feature

  # Optional physical forward limit for reward-only feature/feature_mse MDLM.
  # Keep loader.batch_size/global_batch_size unchanged to preserve the objective.
  # Checkpoints student forwards (extra backward recomputation), splits frozen
  # feature forwards, then computes rewards/bandwidth/normalization over the
  # original loader batch. Positive integer or null (legacy path). Not for DMD
  # or IDLM-ratio/fake training; no guarantee of bitwise/RNG-identical runs.
  mmd_forward_batch_size: null

  mmd_feature_source: diffusion
  # Used when mmd_feature_source='ar'. Either one of this repo's AR checkpoints
  # (a path ending in .ckpt) or an HF repo id for AutoModelForCausalLM.
  #
  # The default is S-FLM's TinyGSM AR -- causal, 250k steps on TinyGSM itself,
  # on the student's exact SmolLM-135M tokenizer, and carrying 49154 embeddings
  # so the student's pad and mask ids need no remapping. Strictly better here
  # than a generic pretrained LM, which encodes plausible *English* rather than
  # plausible TinyGSM programs. Fetch it with scripts/fetch_sflm_ar.sh.
  # 'HuggingFaceTB/SmolLM-135M' is still accepted, for comparison runs.
  mmd_ar_model: ${repo_root:}/checkpoints/tinygsm/ar_notok.ckpt
  # How much of the scored span to mask before reading the teacher's features.
  # Low on purpose: the point is to read the content that is there, not to ask
  # the model to reconstruct it. 0 would be out of distribution for a denoiser.
  mmd_noise_level: 0.1
  # null => the middle block. Late blocks specialize toward the next-token head
  # and early ones barely differ from the embedding, so neither end says much
  # about whether two sequences mean the same thing.
  #
  # A *list* sums one reward term per block, e.g. `[4, 9]`. All of them
  # are read from the same forward, so the extra cost is activations, not
  # compute. Sensible when two depths disagree about what a good answer is --
  # a shallow block tracks lexical agreement, a deep one contextual agreement --
  # and a single number cannot express both.
  mmd_feature_layer: null
  # One weight per entry of `mmd_feature_layer`; null => an unweighted sum.
  #
  # Read this before using a list. The reward per corrupted token grows ~6x per
  # four blocks on this repo's TinyGSM teacher -- `scripts/probe_mmd_features.py`
  # measures 0.00065 at block 0, 0.0077 at block 6, 0.046 at block 11 -- so an
  # unweighted `[6, 11]` is 86% block 11 and adds essentially nothing to using
  # block 11 alone. To make two blocks contribute equally, set weights inversely
  # proportional to their measured per-edit scale: `[6, 11]` wants roughly
  # `[5.9, 1.0]`. Re-measure after changing `mmd_noise_level`; the scales move.
  mmd_feature_layer_weights: null
  # Samples per state. >= 2: leave-one-out has no baseline with one, and an
  # unbaselined score estimator on a reward this large is pure variance. Each
  # sample costs one extra frozen-AR forward.
  # How the two feature sets are compared.
  #   linear -- for the historical rows/token paths, pool both sides and score
  #             the difference with pseudo-Huber. `draws + sentence` instead
  #             uses the actual normalized linear-kernel MMD: MSE between means,
  #             with the fake-sample variance correction when K > 1.
  #   linear_l2 -- negative MSE between empirical real/generated feature means:
  #             -mean_d((mean_real[d] - mean_generated[d])^2), in FP32.
  #             Requires mmd_reward_type=feature. Supports rows/draws and
  #             token/sentence at K=1 or K>1, with existing masks, pooling and
  #             weighted per-layer sums. This is the biased/V-statistic form,
  #             with no off-diagonal U-statistic or fake variance correction.
  #             It compares means, not the aligned-token MSE of feature_mse.
  #   rbf    -- Gaussian-kernel MMD^2 over the token or sentence feature
  #             distributions selected below. Estimates are never clipped;
  #             negative U-statistics produce positive rewards.
  #   pseudo_huber -- only for `draws + sentence`: use the kernel induced by
  #             rho(x,y)=mean_d(sqrt((x_d-y_d)^2+1e-6)-0.001). K=1 recovers the
  #             historical pseudo-Huber reward exactly. For K>1, the distance
  #             is mean_i rho(real,fake_i) minus half the off-diagonal mean
  #             rho(fake_i,fake_j); the reward is its negation. This is an
  #             unbiased estimator conditional on the single fixed real
  #             embedding, with no clamp. It is a separate robust kernel,
  #             not pseudo-Huber applied after estimating linear/RBF MMD.
  #             The coordinate-additive distance need not distinguish joint
  #             distributions that differ only in feature dependencies.
  #
  # At token level, these kernels ignore token order. Both linear and linear_l2
  # see only the pooled means; RBF also detects distribution changes
  # that preserve the mean. An RBF U-statistic can be negative even when the
  # empirical feature sets are identical, producing a positive reward.
  #
  # Interacts with `mmd_scored_positions`: under `non_prompt` the padding tail
  # forms one large identical mode in both distributions, which rbf mostly
  # ignores where linear averages it into the mean.
  mmd_kernel: linear
  # What ONE SAMPLE is, for whichever kernel is chosen.
  #   token    -- every scored position of the kernel row (the default and the
  #               historical behaviour). The distribution matched is over token
  #               features.
  #   sentence -- mean-pool each sequence over its own scored positions first,
  #               then hand the kernel the row's `mmd_kernel_batch_size`
  #               sentence vectors. The distribution matched is over SENTENCES.
  #
  # In `rows` mode, linear/linear_l2 token/sentence levels agree whenever the
  # sequences in a row carry equal scored counts -- a mean of means is then
  # the pooled mean.
  # Beyond that they differ in weighting: token pooling weights a sequence by
  # how much of it was written, sentence level weights every sequence alike.
  # Sentence-level RBF in rows mode still needs K >= 2, because both empirical
  # sides contain K independently observed batch rows.
  #
  # In `draws` mode, sentence level produces one pooled REAL embedding and K
  # independently pooled FAKE embeddings for each state. For linear, RBF and
  # pseudo_huber, K > 1 removes fake self-pairs: unbiased over fake draws with
  # the observed real embedding treated as fixed. K = 1 uses the biased
  # empirical estimate because no off-diagonal fake pair exists. Unlike rows
  # mode, sentence-level RBF is therefore valid at K = 1.
  # linear_l2 always compares the real embedding with the mean of K fake
  # embeddings using MSE, including K > 1, without a variance correction.
  mmd_kernel_level: token
  # What fills the kernel batch selected by `mmd_kernel_batch_size`.
  #   rows  -- adjacent device-batch rows. They have different questions and
  #            diffusion states; one pooled reward is copied back to every row.
  #   draws -- independent answers sampled from the SAME `student_probs` and
  #            diffusion state. Each REINFORCE candidate is the whole set of K
  #            draws, so no reward crosses between different TinyGSM questions.
  #
  # With `draws`, `mmd_group_size=G` supplies G candidate sets and
  # `mmd_kernel_batch_size=K` supplies K answers inside each set: G*K complete
  # answers per input row. `mmd_kernel_level=token` compares n real token
  # features with K*n fake token features. `sentence` first average-pools each
  # answer over the configured scored positions (masked/written positions by
  # default), then compares one real vector with K fake vectors. The IDLM-ratio
  # critic remains unsupported because it exposes no feature distribution.
  mmd_kernel_source: rows
  # Exponent scale: `null` uses 1 / (2 * median(D)) on REAL features per call.
  # For squared Euclidean, this is alpha = 1 / (2 sigma^2). Fitting bandwidth
  # to the student would let it drift as the student does.
  mmd_rbf_alpha: null
  # Distance inside exp(-alpha * D), used only by mmd_kernel: rbf.
  #   squared_euclidean -- D = sum_d (x_d-y_d)^2 (historical default).
  #   pseudo_huber -- D = sum_d (sqrt((x_d-y_d)^2 + delta^2) - delta).
  # This is coordinatewise and summed, using the existing feature loss's
  # smooth pseudo-Huber shape. It is distinct from mmd_kernel: pseudo_huber.
  # With either distance, null alpha uses 1 / (2 * median(D)) on real features.
  # Explicit alpha values tuned for squared Euclidean need recalibration.
  # Pseudo-Huber uses fused Triton reductions on supported CUDA inputs,
  # otherwise the portable tiled PyTorch implementation.
  mmd_rbf_distance: squared_euclidean
  # Positive transition scale in feature units, used only for pseudo_huber.
  mmd_rbf_huber_delta: 0.001
  # Tile edge for the blocked kernel; 0 sizes it from a 256MB scratch budget.
  # Pseudo-Huber caps pair tiles to its own scratch budget; its portable
  # fallback also chunks features. Fused CUDA keeps coordinate scratch local.
  mmd_rbf_block_size: 0
  # Omit only the reference-reference contribution and skip its kernel sums.
  # Keep fake-fake/real-fake pairs, normalization, masks and bandwidth unchanged.
  # Supports feature RBF with rows/draws, token/sentence, and either distance.
  # Token mode supports K=1 with the existing minimum scored-token counts.
  # Independent of exclude_same_sentence, which already omits real-real.
  # Auto bandwidth still measures distances between real features.
  mmd_rbf_omit_real_real: false
  # Omit the entire fake-fake contribution and skip its kernel sums.
  # Reward = 2*RF - RR, or 2*RF if real-real is also omitted.
  # This changes the objective by removing the generated-sample repulsion.
  # Same supported RBF modes/distances as omit_real_real; masks, bandwidth,
  # RF normalization and K/G scaling are unchanged. Also skips cross-sentence
  # FF when exclude_same_sentence=true (that mode still requires K>=2).
  mmd_rbf_omit_fake_fake: false
  # In draws+token RBF, exclude ALL fake-fake pairs from the same generated
  # sentence. Different draws keep every token pair, including equal positions.
  # With K draws and n scored positions, normalize fake-fake by K*(K-1)*n^2
  # and real-fake by K*n^2. Omit the real-real term (one reference sentence).
  # Reward = 2*mean(real-fake) - mean(cross-sentence fake-fake); its negation
  # omits the reference constant, so it is not a complete MMD^2 value.
  # Requires feature reward, kernel=rbf, source=draws, level=token and K>=2.
  # Both squared_euclidean and pseudo_huber distances are supported.
  # False preserves the historical token-diagonal-only estimator.
  mmd_rbf_exclude_same_sentence: false
  # Additionally exclude equal token positions (i=j) from cross-draw fake-fake
  # pairs: keep only r!=s AND i!=j. Requires the cross-sentence mode above
  # (feature + rbf + draws + token, exclude_same_sentence=true, K>=2).
  # Fake-fake denominator is K*(K-1)*n*(n-1); rows with n<2 are inactive.
  # Real-fake still uses ALL i,j and denominator K*n^2. No feature pooling.
  # Both RBF distances and omit_fake_fake are supported; n>=2 still required.
  # Automatic bandwidth still uses the existing real-token distance median.
  mmd_rbf_exclude_same_position: false
  # Kernel-batch size K. Its meaning is selected by `mmd_kernel_source`:
  #
  # With `rows`, K sequences share one kernel row. The row is the unit the
  # statistic is computed over for BOTH kernels -- linear pools it to one mean,
  # rbf takes its valid tokens as the sample set -- so this decides granularity:
  #   1          -- one comparison per sequence (the default, unchanged)
  #   N          -- N sequences matched as a group; all N share the reward
  #   batch_size -- the whole batch as a single pooled distribution
  #
  # Widening is a trade. Measured: exchanging the generated content of two
  # sequences inside one row moves the reward by 7e-09 (linear) and exactly 0
  # (rbf) at N=2, against a clear change at N=1 -- a wider row cannot see
  # content swapped between its members. What it buys is N times the tokens
  # behind the statistic, and N^2 times the pairs for rbf. Must divide the
  # per-device batch size.
  #
  # On CONDITIONAL data each row carries its own question, so a row spanning N
  # examples matches a mixture over N conditions, which two rows can satisfy by
  # swapping answers. That is why 1 is the default here and not the pooled
  # batch.
  #
  # The reward stays per sequence whatever K is -- REINFORCE multiplies each
  # sequence's advantage by its own log-probability -- so a row's reward is
  # shared by its members, which coarsens credit assignment.
  #
  # With `draws`, K is instead the number of complete answers from one state
  # pooled into each candidate reward. It need not divide the device batch.
  mmd_kernel_batch_size: 1

  # Which positions the reward scores.
  #   answer     -- real answer content only: outside the prompt, not padding,
  #                 and not past the answer's terminator.
  #   non_prompt -- everything outside the prompt, padding and post-EOS
  #                 included. The student generates there too (train_on_pad
  #                 puts those positions in the mask), so this holds it to the
  #                 whole of what it wrote rather than to the solution alone.
  #                 Costs the ~3x dilution `answer` exists to avoid: on TinyGSM
  #                 68% of the masked positions are padding after EOS, where
  #                 the two rows trivially agree.
  mmd_scored_positions: answer

  # NOTE the near-identical name above. `mmd_scoreD_positions` picks what
  # counts as CONTENT (answer only, or everything outside the prompt). This one
  # sits inside that choice: given the content set, score only the span the
  # student WROTE, or all of it.
  #   written -- the masked positions of the content set. The default and the
  #              historical behaviour. Outside them the generated row IS the
  #              clean row, so this is the span the two sequences differ on.
  #   all     -- the whole content set, written or not. The unwritten positions
  #              hold identical TOKENS in both rows, so they contribute only
  #              through the feature map's context sensitivity: a hidden state
  #              moves when the tokens around it change.
  #
  # Whichever is chosen, the REINFORCE surrogate still sums log-probabilities
  # over the WRITTEN span alone -- the student did not write the rest and
  # cannot be credited for it. Only the critic's view widens.
  #
  # Measured on OWT (mdlm-owt features, known per-row corruption), `all` does
  # not discriminate better; it dilutes the delta in proportion to the mask
  # fraction -- 7x at 5% masked, converging by 90% -- while correlation with
  # true quality is unchanged above ~300 written tokens and slightly worse
  # below. So its real effect is to reweight the noise schedule toward
  # heavily-masked rows. Expect the dilution to be WORSE here under
  # `mmd_scored_positions=non_prompt`, which already pools a 68% padding tail
  # the two rows agree on.
  # feature_mse requires written: only the masked/content intersection counts.
  mmd_score_positions: written

  # Samples drawn per state, each costing one critic forward. At >= 2 the
  # group's own leave-one-out mean is the baseline. A group of 1 is supported
  # as the cheap end, but has no same-state sample from which to form a
  # baseline, so `mmd_baseline` decides what replaces it.
  mmd_group_size: 4

  # Which control variate removes the reward's offset.
  #   auto  -- group when mmd_group_size >= 2, none when it is 1
  #   group -- leave-one-out within the same-state sample group
  #   batch -- leave-one-out across other active sequences in the device batch;
  #            unbiased and free, but noisier because they have other questions
  #   none  -- subtract nothing; useful mainly as a control. MMD U-statistics
  #            can be negative and therefore produce positive rewards.
  mmd_baseline: auto

  # Optional few-NFE training mixture. The ordinary distillation schedule draws
  # a uniform diffusion time, hence a uniform expected mask probability under
  # the log-linear schedule. When this is non-zero, that fraction of generator
  # rows instead draws its expected mask probability uniformly from
  # [high_mask_min, high_mask_max]. For example, 0.5 / 0.7 / 1.0 devotes half
  # of the rows to states with 70--100% of their trainable positions masked.
  #
  # This controls the corruption used to PRODUCE the student's answer and is
  # unrelated to mmd_noise_level, which only corrupts inputs to a diffusion
  # feature critic. It applies consistently to MMD, DMD, and combined
  # distillation because those objectives share the same generator rollout.
  # Zero preserves the historical sampler exactly, including its RNG stream.
  high_mask_fraction: 0.0
  high_mask_min: 0.7
  high_mask_max: 1.0

  # Fixed clipping of generator expected masking probability, matching OWT.
  # Original preserves the existing sampler/high-mask mixture exactly.
  # Clipped remaps its stratified draws into [min, max]; use high_mask_fraction=0.
  # Applies to generator inputs in both student and fake-critic training.
  # Prompt masking, teacher/fake loss corruption and evaluation are unchanged.
  # Bounds intersect the log-linear noise support (max=1 becomes 0.999);
  # realized mask counts remain Bernoulli draws, not hard count constraints.
  mask_schedule:
    mode: original
    min: 0.45
    max: 0.95

  # CONTROL, not a training mode. Permutes each row's rewards across the group
  # before the leave-one-out baseline, so a sample is credited with some other
  # sample's score. Reward values are untouched, so `mmd/reward`,
  # `mmd/reward_spread` and `mmd/advantage_absmean` are distributed exactly as
  # in an honest run -- only the credit assignment is destroyed.
  #
  # Answers the question the logged series cannot: whether the reward's
  # *content* drives the result, or whether an arm would land in the same place
  # on noise alone. If a shuffled arm matches a real one, the feature map is not
  # the active ingredient and comparing feature layers is meaningless.
  mmd_shuffle_rewards: False
  accum_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  fake_frequency: 1
  gradient_clipping_val: 1.0

loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ancestral  # ancestral_cache (only for MDLM), ancestral, analytic
  steps: 1000
  noise_removal: ancestral  # 'ancestral', 'greedy', 'none'
  step_convention: idlm  # 'idlm': NFE = steps + 1 (separate noise-removal
                         # call after the loop). 'sflm': NFE = steps (noise
                         # removal folded into the last loop iteration,
                         # matches jdeschena/s-flm; this is what
                         # scripts/eval_tinygsm_idlm_mdlm.sh selects for the
                         # conditional TinyGSM protocol).
  # Which still-masked positions each reverse step commits.
  #   'random'                 upstream: an independent Bernoulli draw per
  #                            masked position, so `steps` is the budget.
  #   'low_confidence_static'  the k positions the model is most confident
  #                            about, k taken from the noise schedule -- so
  #                            `steps` is still the budget and only *which*
  #                            positions fill each quota changes.
  #   'low_confidence_dynamic' ADAPTIVE: commit every position above
  #                            `dynamic_threshold`. `steps` is IGNORED -- the
  #                            threshold is the budget and the NFE is an
  #                            outcome, reported back as metadata.
  # The low_confidence_* rules are ported from yrOPDLM and need an absorbing
  # state (masked diffusion) with an ancestral predictor.
  remasking_strategy: random
  dynamic_threshold: 0.9  # the low_confidence_dynamic budget knob; yrOPDLM
                          # sweeps 0.85 / 0.9 / 0.95
  max_steps: null  # cap on the adaptive loop; null -> model.length, the
                   # one-commit-per-step worst case, which never binds
  temperature: 1.0  # token draw: 1.0 = upstream categorical, 0.0 = greedy.
                    # Confidence is read off the raw p_x0 either way.
  use_float64: True
  p_nucleus: 1.0
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False
  loss_precision: 'bf16'  # bf16, float32, float64
  finetune_path: ''
  # Native MDLM distillation warm start: raw (existing behavior) or ema.
  # ema initializes student, frozen teacher and fake model from checkpoint EMA;
  # DM features use that teacher, and native AR features use their own EMA.
  # Keeps the checkpoint EMA decay/counter. Does not rewrite resumed weights.
  finetune_weights: raw
  # Train the checkpoint itself with the original model objective instead of
  # constructing the frozen-teacher/fake-model distillation system. This takes
  # precedence over adversarial_distill.is_distill so an existing distillation
  # command can be turned into the teacher baseline with one extra override.
  # finetune_path is still a warm start: optimizer/scheduler/global step begin
  # a new run. Use checkpointing.resume_ckpt_path for an exact interrupted-run
  # resume. The flag also restores Lightning's automatic gradient accumulation
  # from loader.global_batch_size; distillation commands normally set it to 1
  # because their manual optimization path accumulates internally.
  continue_teacher: False

eval:
  # --- Conditional (prompt-completion) validation, and the GSM8K benchmark ---
  # Added on top of upstream: training logic is untouched, this only changes
  # what validation measures. null => auto (on for tiny-gsm / gsm8k-test).
  conditional_samples: null
  tinygsm_exec: True
  tinygsm_exec_timeout: 5.0
  validate_before_train: True
  gsm8k_at_validation: True
  gsm8k_num_examples: null
  gsm8k_batch_size: 16
  gsm8k_every_n_validations: 1
  gsm8k_steps: null
  # Noise-removal placement for the in-training benchmark. 'sflm' so a
  # val/gsm8k_acc point and a scripts/eval_tinygsm_idlm_mdlm.sh number
  # mean the same thing; see sampling.step_convention.
  gsm8k_step_convention: sflm
  gsm8k_data_path: ${repo_root:}/data/gsm8k_test.json
  # Score the benchmark a second time with the token choice made greedily
  # (argmax of p_x0) instead of sampled, on the same schedule and step budget,
  # as val/gsm8k_acc_greedy. Costs one more `gsm8k_steps` pass per validation.
  # Skipped automatically when sampling.temperature is already 0.
  gsm8k_greedy_token: True
  # --- Accuracy-vs-NFE frontier for the adaptive sampler ---
  # `low_confidence_dynamic` has no fixed step budget, so one accuracy number
  # cannot describe it: the threshold is the budget and the NFE is an outcome.
  # At every validation that runs the GSM8K benchmark, score each threshold and
  # log the curve -- as a per-checkpoint scalar series indexed by NFE, and as a
  # figure overlaying every checkpoint so far. `[]` or null disables the sweep.
  # Cost is the sum of the thresholds' NFE (~157 for the default grid) against
  # the single `gsm8k_steps` run the headline metric already pays for.
  gsm8k_pareto_thresholds: [0.5, 0.6, 0.7, 0.8, 0.9, 0.95]
  # 0 is the only temperature at which a threshold means "the model's top-1
  # probability exceeds it"; above it the same threshold buys a smaller budget.
  gsm8k_pareto_temperature: 0.0
  # Additional sweep: same backbone/weights/grid, FP32 SUBS normalization.
  # Keeps legacy metrics; new metrics/history use the _fp32norm suffix.
  # Approximately doubles the threshold-sweep evaluation cost.
  gsm8k_pareto_fp32: True
  # Optional fixed frontier drawn as a dashed reference line. Written by
  # scripts/make_pareto_reference.sh; null (or a missing file) just omits it.
  gsm8k_pareto_reference: ${repo_root:}/data/pareto_reference_mdlm_teacher.json
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  generated_samples_path: ${cwd:}/samples.json

optim:
  weight_decay: 0
  lr: 3e-4
  # Fake-model base LR for distillation; follows the student LR unless overridden.
  fake_lr: ${optim.lr}
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 1_000_000
  log_every_n_steps: 100
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 5000

# wandb:
#   project: flow-ode
#   notes: Flow ODEs for UDLM
#   group: null
#   job_type: null
#   name: null
#   id: ${.name}_${seed}
