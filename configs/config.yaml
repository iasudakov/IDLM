defaults:
  - _self_
  - /callbacks: [checkpoint_every_n_steps, checkpoint_monitor, learning_rate_monitor]
  - /data: openwebtext
  - /model: small
  - /strategy: ddp
  - /noise: log-linear
  - /lr_scheduler: constant_warmup
  - /prior: none
  - /algo: duo_base
  - /logger: underdeep

mode: train  # train / ppl_eval / sample_eval
debug: False
seed: 1

adversarial_distill:
  is_distill: False

  # --- Distillation objective -----------------------------------------------
  # The generator loss is `dmd_weight * (teacher - fake) + mmd_reward_weight *
  # REINFORCE(feature reward)`. Defaults reproduce the published objective
  # exactly: DMD alone, the MMD critic never built or downloaded.
  dmd_weight: 1.0

  # --- Paired AR feature reward (ported from the TinyGSM branch) -------------
  # A frozen model used as a fixed *feature map* rather than a likelihood
  # critic: run it over the clean row and over the student's sample, mean-pool
  # one middle block's hidden states, and reward the student for closing the
  # gap under a pseudo-Huber distance. Optimized by REINFORCE with a
  # leave-one-out baseline over `mmd_group_size` samples drawn at the same
  # state. See `mmd_reward.py`.
  #
  # 0 disables it entirely -- the feature map is never even loaded.
  mmd_reward_weight: 0.0

  # What a sampled answer is scored ON. The group sampling, the leave-one-out
  # baseline and the REINFORCE surrogate are identical either way; only the
  # reward function changes.
  #   feature -- pooled-feature distance to x0 under a frozen model. A
  #              similarity to one particular reference, which is why the
  #              TinyGSM probe finds it close to a soft edit distance.
  #   idlm    -- the ELBO log-density ratio nll_fake(x) - nll_teacher(x), the
  #              same quantity DMD differentiates, reached by a score estimator
  #              instead. Judges the sample on its own merits rather than
  #              against a reference, and needs no feature map, so
  #              mmd_feature_source / mmd_feature_layer / mmd_ar_model are all
  #              ignored. It needs a TRAINED fake -- an untrained one is still a
  #              copy of the teacher and the ratio collapses to ~0 for every
  #              sample -- so the fake phase keeps running even at
  #              dmd_weight=0, which for the feature reward switches it off.
  #              `dmd_weight=0` with this reward therefore means: train the fake
  #              as usual, but give the generator only the REINFORCE term.
  mmd_reward_type: feature

  # Which frozen model supplies the features.
  #   ar        -- `kuleshov-group/owt-ar`, a causal DiT on the student's exact
  #                corpus and vocabulary (50258 ids, matching mdlm-owt token for
  #                token). Independent of the model being distilled.
  #   diffusion -- the frozen teacher already in memory. Cheaper, but it
  #                measures the reward in the student's own feature space.
  mmd_feature_source: ar

  # HF hub id (or a local dir with the same config.json / pytorch_model.bin).
  # Loaded via the vendored `models/backbone_dit_legacy.py`, because the
  # published remote code imports transformers.models.qwen3, which this
  # environment's transformers 4.38.2 does not have.
  mmd_ar_model: kuleshov-group/owt-ar

  # Masking applied to BOTH rows before reading the diffusion teacher, which
  # never saw a clean sequence. Ignored by `mmd_feature_source: ar` -- a causal
  # LM did see clean text, so masking there would inject a difference into a
  # comparison meant to isolate what the student wrote.
  #
  # Set 0.0 to feed the teacher whole, unmasked sentences instead: the masking
  # is `rand < noise_level`, so nothing is dropped and the features are read off
  # the clean rows. That is what the TinyGSM runs used, and it costs nothing
  # extra here -- with `dmd_weight=0` the teacher is already resident and
  # otherwise unused, where `mmd_feature_source: ar` loads a second model.
  # Verified on OWT: the blocks resolve through the `hf_dit` wrapper and the
  # reward stays monotone in corruption size.
  mmd_noise_level: 0.1

  # Which block's hidden states to read. `null` is the middle one: late layers
  # specialize toward the next-token head and early ones barely differ from the
  # embedding, so neither end says much about whether two sequences *mean* the
  # same thing. Both owt-ar and mdlm-owt have 12 blocks, so null resolves to 6.
  #
  # A list asks for a summed reward, one pseudo-Huber term per block. Mind the
  # scale spread: on the TinyGSM teacher the reward per corrupted token grew
  # ~6x per four blocks, which makes an unweighted sum very nearly the deepest
  # block alone. Use `mmd_feature_layer_weights` to put terms on equal footing.
  mmd_feature_layer: null
  mmd_feature_layer_weights: null

  # How the two feature sets are compared.
  #   linear -- pool both sides and score the difference with pseudo-Huber.
  #             This is what an MMD with a LINEAR kernel reduces to: it sees
  #             the means and nothing else, so a sample matching the clean row
  #             on average is free regardless of its shape.
  #   rbf    -- Gaussian-kernel MMD^2 between the per-position feature
  #             distributions, unbiased (self-pairs removed). Sensitive to more
  #             than the mean, which is the point given the probe's finding
  #             that the linear reward behaves close to a soft edit distance.
  # Computed by `mmd_rbf.py`, which reduces the three pair sums a tile at a
  # time and never materialises the (batch, length, length) Gram matrix.
  mmd_kernel: linear
  # Kernel bandwidth as `alpha = 1 / (2 sigma^2)`. `null` measures it per call
  # by the median heuristic on the REAL branch -- a bandwidth fitted to the
  # student would drift as the student does, making the reward a moving target.
  mmd_rbf_alpha: null
  # Tile edge for the blocked kernel; 0 sizes it from a 256MB scratch budget.
  mmd_rbf_block_size: 0
  # How many sequences share one kernel row. The row is the unit the statistic
  # is computed over for BOTH kernels -- linear pools it to one mean, rbf takes
  # its valid tokens as the sample set -- so this decides the granularity:
  #   1            -- one comparison per sequence (the default, unchanged)
  #   N            -- N sequences matched as a group; all N share the reward
  #   batch_size   -- the whole batch as a single pooled distribution
  #
  # Widening is a trade, not a free win. A row of N can be satisfied by samples
  # that SWAP content between its sequences: two answers exchanged pool to the
  # same mean and hold the same token multiset, so neither kernel can tell.
  # What it buys is N times the tokens behind the statistic, and for rbf N^2
  # times the pairs. Must divide the per-device batch size.
  #
  # The reward stays per sequence whatever this is -- REINFORCE multiplies each
  # sequence's advantage by its own log-probability -- so a row's reward is
  # simply shared by the sequences in it, which coarsens credit assignment.
  mmd_kernel_batch_size: 1

  # Samples drawn per state, each costing one critic forward. At >= 2 the
  # group's own leave-one-out mean is the baseline. 1 is allowed and is the
  # cheap end -- a quarter the critic cost of 4 -- but it has no second sample
  # at the same state, so the baseline has to come from somewhere else.
  mmd_group_size: 4

  # Which control variate removes the reward's offset.
  #   auto  -- group when mmd_group_size >= 2, none when it is 1
  #   group -- leave-one-out within the group; the lowest-variance option,
  #            since every member was drawn at the same state
  #   batch -- leave-one-out across the other sequences in the batch. Unbiased
  #            and free, but noisier: those rows carry different x0 and
  #            different masking, so their rewards measure different things.
  #   none  -- subtract nothing. Still unbiased, but the pseudo-Huber reward is
  #            a negative distance, so every advantage is negative and every
  #            update pushes down whatever the student sampled. For measuring
  #            what the baseline is worth, not for training.
  mmd_baseline: auto

  accum_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  fake_frequency: 1
  gradient_clipping_val: 1.0

loader:
  global_batch_size: 512
  eval_global_batch_size: ${.global_batch_size}
  # Note: batch_size and eval_batch_size are **per machine**
  batch_size: ${div_up:${.global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  eval_batch_size: ${div_up:${.eval_global_batch_size}, ${eval:${trainer.devices} * ${trainer.num_nodes}}}
  num_workers: ${eval:"len(__import__('os').sched_getaffinity(0))"}
  pin_memory: True

sampling:
  predictor: ancestral  # ancestral_cache (only for MDLM), ancestral, analytic
  steps: 1000
  # Softmax temperature on the denoiser's x0 prediction, applied inside the
  # ancestral update before the posterior is formed. 1.0 is exactly the
  # published sampler -- the tempering is skipped outright, not computed with a
  # scale of one -- so this defaults to a no-op.
  #
  # Deliberately NOT applied to the posterior `q(x_s | x_t)`. That distribution
  # mixes the model's belief with the schedule's "stay masked" mass `1 - alpha_s`,
  # and tempering the mixture would rescale the unmasking rate too, i.e. quietly
  # change how many tokens each step commits. Tempering `p(x0 | x_t)` changes
  # only what the model believes, leaving the schedule intact.
  temperature: 1.0
  noise_removal: ancestral  # 'ancestral', 'greedy', 'none'
  use_float64: True
  p_nucleus: 1.0
  num_sample_batches: 2  # Total samples: `num_gpus` * `loader.eval_batch_size` * num_sample_batches
  num_sample_log: 2
  semi_ar: False
  stride_length: 1
  num_strides: 1

training:
  ema: 0.9999
  antithetic_sampling: True
  importance_sampling: False
  sampling_eps: 1e-3
  change_of_variables: False
  loss_precision: 'bf16'  # bf16, float32, float64
  finetune_path: ''

eval:
  checkpoint_path: ''  # Used to evaluate a checkpoint after training.
  disable_ema: False
  compute_generative_perplexity: False
  perplexity_batch_size: 8
  compute_perplexity_on_sanity: False
  gen_ppl_eval_model_name_or_path: gpt2-large  # gpt2-large, meta-llama/Llama-2-7b-hf
  generate_samples: True
  generated_samples_path: ${cwd:}/samples.json

  # --- Gradient Moment (arXiv:2603.20155) -----------------------------------
  # `||E_samples[grad L] - E_data[grad L]||^2` under the `gen_ppl` reference LM:
  # how far the gradient our samples give it sits from the gradient real text
  # gives it. Ported from yrELF so the numbers are comparable with that project.
  #
  # Worth the cost because it answers what generative perplexity cannot. gen_ppl
  # rewards text the reference LM finds predictable, which a COLLAPSING model
  # produces more of -- an OWT run here drove gen_ppl 68 -> 11.9 while entropy
  # fell and held-out NLL rose, i.e. the metric improved because the model was
  # degrading. GM backprops through the reference LM and compares against real
  # data, so collapse moves it the right way.
  #
  # Needs the `gradient_moment` sibling package:
  #   pip install -e /path/to/gradient-moment --no-deps
  # Missing package, too few rows, or any error inside it is reported and
  # skipped, never fatal.
  #
  # When `owt_pareto_steps` is also set, GM is computed PER BUDGET as well, so
  # the frontier carries an axis that collapse cannot flatter. That is where it
  # earns its cost: gen_ppl rewards a degenerate sampler, and the cheap budgets
  # are where degeneracy appears first. Budget GM is scored once per seed and
  # averaged, so its spread means what the other spreads mean.
  #
  # Mind the multiplication: budgets x seeds GM calls per validation, at
  # ~2s for 16 rows and ~4s for 64. [2,4,8,16,32,64] with 5 seeds is 30 calls,
  # a minute or two on top of the sampling. `owt_pareto_every_n_validations` is
  # the knob if that is too much.
  owt_gm: false
  # Cap on sample rows AND real reference rows. Reference rows are collected
  # from the validation batches; sample rows come from the existing sampling
  # loop, so `sampling.num_sample_batches * loader.eval_batch_size` bounds them.
  gm_eval_samples: 64
  # Rows per half-batch. One GM pair is 2x this per side, split in half
  # internally -- the halves' inner product is what makes the squared norm
  # unbiased, so a pair cannot be formed from fewer rows than this.
  gm_eval_batch_size: 4

  # --- Sampling-steps frontier (quality vs diversity) -----------------------
  # Sample the checkpoint at each of these denoising-step budgets and record
  # generative perplexity against sample entropy, drawing the frontier as
  # `pareto/frontier`. Both axes are needed: perplexity alone falls when the
  # model collapses onto generic text, and entropy falling with it is the tell.
  #
  # `null` disables the sweep. It is opt-in because it costs the SUM of the
  # budgets in extra sampling -- [2,4,8,16,32,64] is 126 forward passes per
  # batch, on top of the validation that already ran. Requires
  # `eval.compute_generative_perplexity=True`; it is skipped with a message
  # otherwise, since perplexity is one of the two axes.
  owt_pareto_steps: null          # e.g. [2, 4, 8, 16, 32, 64]
  # Run the sweep on every Nth validation, to keep a cheap validation cadence
  # while still tracking the frontier.
  owt_pareto_every_n_validations: 1
  # Batches per budget; 0 means follow `sampling.num_sample_batches`. More
  # batches steady the perplexity estimate, at linear cost.
  owt_pareto_num_batches: 0
  # Seeded repeats per budget, averaged, with the spread drawn as error bars.
  # 1 keeps the old single-shot behaviour and seeds nothing.
  #
  # This is not just "sample more" -- raising `owt_pareto_num_batches` would
  # also shrink the error bars. Fixing the seeds makes every checkpoint draw
  # the SAME noise, so a shift in the frontier between checkpoints reflects the
  # model changing rather than one validation getting luckier draws. Since the
  # plot exists to show which way the frontier is MOVING, that paired
  # comparison matters more than the raw variance.
  #
  # Cost is linear: 5 seeds is 5x the sweep. Pair it with
  # `owt_pareto_every_n_validations` to keep the total in check.
  owt_pareto_seeds: 1
  # Optional JSON frontier drawn as a fixed dashed baseline, in the same point
  # format ({steps, entropy, gen_ppl}). Missing file simply omits it.
  owt_pareto_reference: null

  # --- Temperature sweep (`mode=pareto_eval`) --------------------------------
  # One finished checkpoint, swept over sampling temperatures instead of over
  # training steps: each temperature draws its own (entropy, gen_ppl) frontier
  # across `owt_pareto_steps`, and the figure puts them on one axes.
  #
  # Where the training-time sweep asks "is this run's frontier moving the right
  # way", this asks the question you can only ask once training is done: at a
  # fixed step budget, what does trading the sampler's sharpness buy. Low
  # temperature sharpens `p(x0|x_t)` -- more fluent, less varied, down and to the
  # LEFT; high temperature the other way. A student that beats its teacher only
  # by being sharper is visible here as a curve that sits on the teacher's own
  # temperature line rather than below it.
  #
  # Budgets, seeds and batches come from the `owt_pareto_*` knobs above, so a
  # sweep is configured the same way in both places.
  pareto_temperatures: [0.7, 0.8, 0.9, 1.0, 2.0]
  # Run that same temperature sweep DURING training, on every Nth validation.
  # 0 is off, which is the right default: it costs `len(pareto_temperatures)`
  # times the budget sweep it runs on top of, so with the documented budget list
  # one validation would spend 5 x 126 forward passes per batch on it.
  #
  # Two figures appear when it is on. `pareto/temperature_frontier` is the
  # current checkpoint's fan -- the figure `mode=pareto_eval` draws -- and
  # `pareto/temperature_by_checkpoint` stacks every checkpoint swept so far,
  # one panel per budget and one line per checkpoint, which is where a run's
  # progress actually reads. Scalars land as
  # `val/gen_ppl_s{budget}_t{temperature}` and `val/entropy_...`, so there are
  # `budgets x temperatures` of each: keep both lists short.
  #
  # Budgets, seeds and batches come from the `owt_pareto_*` knobs above, and
  # the sample count per point matches the budget sweep's, so the T=1 curve is
  # directly comparable to the frontier `pareto/frontier` draws.
  owt_pareto_temp_every_n_validations: 0
  # The trained student to evaluate: a Lightning `.ckpt` written by training.
  # `eval.checkpoint_path` stays what it is during training -- the HF id the
  # `hf_dit` backbone is BUILT from -- and this supplies the trained weights on
  # top of it. Empty evaluates whatever `checkpoint_path` alone produces, i.e.
  # the teacher, which is how you measure the baseline curve.
  student_ckpt_path: ''
  # Several checkpoints in one sweep, compared on the same axes. Takes
  # precedence over `student_ckpt_path` when non-empty; an empty string as an
  # ENTRY means "the model as built", i.e. the teacher, so it can sit in the
  # list alongside the students it is the baseline for.
  #
  # Every checkpoint is driven through the same temperatures, budgets and
  # seeds, in the same order, so the comparison is paired the way the
  # temperatures already are: a gap between two checkpoints' curves is the
  # weights differing, not one of them drawing luckier noise.
  student_ckpt_paths: []

optim:
  weight_decay: 0
  lr: 3e-4
  beta1: 0.9
  beta2: 0.999
  eps: 1e-8

trainer:
  _target_: lightning.Trainer
  accelerator: cuda
  num_nodes: 1
  devices: ${device_count:}
  accumulate_grad_batches: ${div_up:${loader.global_batch_size}, ${eval:${trainer.devices} * ${loader.batch_size} * ${trainer.num_nodes}}}
  gradient_clip_val: 1.0
  precision: 'bf16'
  num_sanity_val_steps: 2
  max_steps: 1_000_000
  log_every_n_steps: 100
  limit_train_batches: 1.0   # train on full dataset, can be used to toggle quick run
  limit_val_batches: 1.0     # validate on full dataset, can be used to toggle quick run
  val_check_interval: 5000

# wandb:
#   project: flow-ode
#   notes: Flow ODEs for UDLM
#   group: null
#   job_type: null
#   name: null
#   id: ${.name}_${seed}
#   tags:
#     - ${noise.type}
#     - ${data.train}
#     - ${data.valid}
#     - ${algo.name}

hydra:
  run:
    dir: ./outputs/${data.train}/${now:%Y.%m.%d}/${now:%H%M%S}
  job:
    chdir: true

checkpointing:
  # Use custom `save_dir` if, e.g., saving to S3 bucket, otherwise leave this parameter as is
  save_dir: ${cwd:}
  # Note: `checkpoints` path should correspond to `checkpoint_every_n_steps.dirpath`
  resume_from_ckpt: true
  resume_ckpt_path: ${.save_dir}/checkpoints/last.ckpt
  # Persist `save_dir` across preemptions via Nirvana's snapshot store, the way
  # yrDiT's training scripts do: restore once at startup, push after every
  # checkpoint write. A preempted job comes back with an empty local disk, so
  # without this `resume_ckpt_path` never exists and every restart silently
  # begins from step 0.
  #
  # Safe to leave on everywhere: `yt_tools` only exists inside the Nirvana job
  # image, and off it every call is a no-op. Failures on either side are
  # reported and swallowed -- a snapshot problem should cost progress, not the
  # run.
  snapshot: true
  use_periodic_train_batch_checkpoint: false
